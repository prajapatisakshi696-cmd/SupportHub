services:
  - type: web
    name: supporthub-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
